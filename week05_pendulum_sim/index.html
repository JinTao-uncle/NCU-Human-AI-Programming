<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>单摆模拟器 — 赵金涛 5807126084</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a24;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #aab;
    overflow: hidden;
  }
  canvas {
    display: block;
    border-radius: 12px;
  }
  .info {
    margin-top: 10px;
    font-size: 13px;
    opacity: 0.5;
    letter-spacing: 1px;
  }

  /* ===== 控制面板 ===== */
  .controls {
    margin-top: 18px;
    display: flex;
    gap: 28px;
    align-items: flex-end;
  }
  .slider-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .slider-group label {
    font-size: 12px;
    color: #8899bb;
    letter-spacing: 0.5px;
  }
  .slider-group input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 140px;
    height: 4px;
    border-radius: 2px;
    background: #2a2a3a;
    outline: none;
    cursor: pointer;
  }
  .slider-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #4a9eff;
    box-shadow: 0 0 6px rgba(74,158,255,0.5);
    cursor: pointer;
  }
  .slider-group .val {
    font-size: 13px;
    color: #6ac;
    font-variant-numeric: tabular-nums;
    min-width: 50px;
    text-align: center;
  }
  .btn-reset {
    padding: 7px 18px;
    border: 1px solid rgba(74,158,255,0.35);
    border-radius: 6px;
    background: rgba(74,158,255,0.08);
    color: #6ac;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .btn-reset:hover {
    background: rgba(74,158,255,0.18);
    border-color: rgba(74,158,255,0.6);
    box-shadow: 0 0 10px rgba(74,158,255,0.15);
  }
</style>
</head>
<body>
<canvas id="sim"></canvas>

<!-- ===== 参数控制面板 ===== -->
<div class="controls">
  <div class="slider-group">
    <label>摆长 (px)</label>
    <input type="range" id="sliderL" min="100" max="350" value="200" step="1">
    <span class="val" id="valL">200</span>
  </div>
  <div class="slider-group">
    <label>重力 (m/s²)</label>
    <input type="range" id="sliderG" min="1" max="25" value="9.8" step="0.1">
    <span class="val" id="valG">9.8</span>
  </div>
  <div class="slider-group">
    <label>阻尼</label>
    <input type="range" id="sliderD" min="0" max="0.010" value="0.001" step="0.001">
    <span class="val" id="valD">0.001</span>
  </div>
  <button class="btn-reset" id="btnReset">重置摆动</button>
</div>

<div class="info">单摆模拟 · 赵金涛 · 5807126084 · 第5周</div>

<script>
// ===== 画布初始化 =====
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');
canvas.width = 600;
canvas.height = 500;

// ===== 物理参数（可变） =====
let L = 200;          // 摆长 (px)
let g = 9.8;          // 重力加速度
let damping = 0.001;  // 阻尼系数（与滑块初始值一致）
const SCALE = 0.01;   // 像素→米换算系数（视觉调参）
const INITIAL_THETA = Math.PI / 4; // 初始角度 45°

// 初始状态
let theta = INITIAL_THETA;
let omega = 0;            // 角速度

// 支点坐标
const pivotX = canvas.width / 2;
const pivotY = 80;

// ===== 物理更新（简谐近似 + 精确 sin） =====
function update(dt) {
  // 角加速度 α = -(g/L) * sin(θ)
  const alpha = -(g / (L * SCALE)) * Math.sin(theta) * SCALE;
  omega += alpha * dt;
  omega *= (1 - damping);
  theta += omega * dt;
}

// ===== 绘制 =====
function draw() {
  // 清屏
  ctx.fillStyle = '#1a1a24';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 摆球坐标
  const bobX = pivotX + L * Math.sin(theta);
  const bobY = pivotY + L * Math.cos(theta);

  // --- 支点 ---
  ctx.beginPath();
  ctx.arc(pivotX, pivotY, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#556';
  ctx.fill();

  // --- 摆线 ---
  ctx.beginPath();
  ctx.moveTo(pivotX, pivotY);
  ctx.lineTo(bobX, bobY);
  ctx.strokeStyle = 'rgba(160,170,200,0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // --- 摆球发光效果 ---
  const glow = ctx.createRadialGradient(bobX, bobY, 2, bobX, bobY, 30);
  glow.addColorStop(0, 'rgba(100,180,255,0.35)');
  glow.addColorStop(1, 'rgba(100,180,255,0)');
  ctx.beginPath();
  ctx.arc(bobX, bobY, 30, 0, Math.PI * 2);
  ctx.fillStyle = glow;
  ctx.fill();

  // --- 摆球本体 ---
  const ballGrad = ctx.createRadialGradient(bobX - 4, bobY - 4, 2, bobX, bobY, 16);
  ballGrad.addColorStop(0, '#a0d4ff');
  ballGrad.addColorStop(0.6, '#4a9eff');
  ballGrad.addColorStop(1, '#1a5aaa');
  ctx.beginPath();
  ctx.arc(bobX, bobY, 16, 0, Math.PI * 2);
  ctx.fillStyle = ballGrad;
  ctx.fill();

  // --- 轨迹虚影 ---
  ctx.beginPath();
  ctx.arc(pivotX, pivotY, L, Math.PI / 2 - 0.8, Math.PI / 2 + 0.8);
  ctx.strokeStyle = 'rgba(100,180,255,0.08)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// ===== 主循环 =====
let lastTime = null;
function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = (timestamp - lastTime) / 1000; // 秒
  lastTime = timestamp;

  // 物理子步（提高稳定性）
  const steps = 4;
  for (let i = 0; i < steps; i++) {
    update(dt / steps);
  }

  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

// ===== 重置函数（全局作用域，供按钮调用） =====
function resetAnimation() {
  theta = INITIAL_THETA;
  omega = 0;
  lastTime = null; // 重置时间基准，防止跳帧
}

// ===== 交互控制 =====
const sliderL = document.getElementById('sliderL');
const sliderG = document.getElementById('sliderG');
const sliderD = document.getElementById('sliderD');
const valL = document.getElementById('valL');
const valG = document.getElementById('valG');
const valD = document.getElementById('valD');
const btnReset = document.getElementById('btnReset');

sliderL.addEventListener('input', function() {
  L = Number(this.value);
  valL.textContent = L;
});

sliderG.addEventListener('input', function() {
  g = Number(this.value);
  valG.textContent = g;
});

sliderD.addEventListener('input', function() {
  damping = Number(this.value);
  valD.textContent = damping.toFixed(3);
});

btnReset.addEventListener('click', resetAnimation);
</script>
</body>
</html>
